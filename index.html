<style>

  display:flex;flex-direction:column;align-items:center;overflow:hidden;

/* Openers and special pages */

  font-family:var(--ui);font-size:.85rem;text-decoration:none;color:inherit;cursor:pointer}
.toc-row .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.75rem}

a.toc-row .r{color:var(--accent)}
.toc-row.locked .ti{color:var(--muted)}
.locked-page .num{font-family:var(--ui);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0}
.locked-page h2{font-family:var(--display);font-weight:400;font-size:2.2rem;line-height:1.08;margin:.5rem 0 1.4rem}

.foot{width:min(100%,36rem);display:flex;align-items:center;gap:.6rem;padding:.6rem 16px;font-family:var(--ui);font-size:.8rem;color:var(--muted)}
.foot .where{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
const DATA = {"chapters": [{"n": 1, "number": "Chapter One", "title": "Mutton", "locked": false, "blocks": ["<p>Before December, our entire chat history was two messages long.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Happy Birthday!🥳<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Thank you Maxeen🎀<\/div>", "<p>That was it. October, twenty minutes to one in the morning, on the night her birthday started, one emoji each. I'd sent mine from bed, a polite little ping into the dark, the kind you send to someone you've noticed for two years and spoken to never. She replied three minutes later. She'd spelled my name wrong in a way that sounded right, put a ribbon after it, and gone back to her life. I went to sleep.<\/p>", "<p>She was a super senior. Two years ahead of me in college, only five months older. That math never made sense to me and I never asked. I knew her the way you know a song you've never looked up: a face at a table in the college café, a laugh from the corridor near the labs, a name that came up in other people's sentences.<\/p>", "<p>Sam had been my best friend for more than half a decade, which in college terms is roughly a geological age. We'd fought, made up, shared hostels, shared rooms, shared a single plate of beef fry between six people, and once, during a phase I don't fully stand behind, I'd given him a knife as a gift. He loved it. He carried it everywhere. That tells you most of what you need to know about Sam.<\/p>", "<p>I was in second year, and I collected glances of her the way other people collect stamps. Her at the café. Her laughing at something on her phone. Her walking past the labs with her hair tied up in a way that made the whole corridor look underdressed. I went to that café more often than my coffee habit could explain. I could not hold eye contact with her for longer than it takes to read a menu. I had never once had a reason to walk over and say hello.<\/p>", "<p>I also didn't know, back then, that she was already somebody's. Nobody told me, and I never asked, because asking would have meant admitting I'd noticed.<\/p>", "<p>Then, one December, Sam's older brother got engaged to her older sister.<\/p>", "<p>I skipped the engagement. Umma said it was <em>just<\/em> an engagement, and we weren't even related, and I had college, and I let that be the reason. Sam's brother scolded me for it later, properly, the way older brothers do. It was not a good decision. I knew that even while I was making it.<\/p>", "<p>Five days later, Sam and I were somewhere doing nothing, and he said, very casually, the way he says everything that's going to ruin my week:<\/p>", "<p>\"My new cousin-sister says you're handsome.\"<\/p>", "<p>I asked if she needed glasses. I asked what she thought of <em>him<\/em>, and he said she liked tall guys, and I said, well, there you go, definitely glasses. He told me to stop thinking so low of myself, which, coming from Sam, is practically a TED talk.<\/p>", "<p>\"Tell her she looks like an air hostess,\" I said.<\/p>", "<p>I meant it as a compliment. She did look like one: neat, proper, the kind of pretty that seems to know where the emergency exits are. Somewhere between my mouth and Sam's mouth and hers, it arrived as <em>he says you look fine<\/em>.<\/p>", "<p>That was the whole first round. One compliment from her, one compliment from me, both delivered by a courier who lost half of mine on the way. Then nothing, for a year. Sam had a new friend now, they talked, they met up in Bangalore, and I'd see the two of them say hi across campus and feel a small, stupid flicker of something I didn't have a name for.<\/p>", "<p>That February, in the hostel, Sam started taking calls at night. Long ones. Two, three in the morning, his voice low and then suddenly not low at all, laughing at something on the other end. I asked who it was. He said an older girl, and blah blah, and wouldn't give me a name. I didn't push. I felt a little sad about it, which surprised me, and then I put my earphones in and turned on noise cancellation and could still hear him.<\/p>", "<p>It took me almost a year to find out who was on the other end of those calls.<\/p>", "<p>Then she graduated, and the café got noticeably worse.<\/p>", "<p>What I didn't know was that, somewhere in all his talking with her, Sam had kept bringing me up.<\/p>", "<p>On Christmas Day, almost exactly a year after the air hostess, Sam and I were out on my bike. He was on the back, phone pressed to his ear, talking to someone. Between sentences he leaned forward and said there was a wedding. Her cousin's. In Mattoor. Did I want to come?<\/p>", "<p>The first thing that came into my head was a joke, and like most of the first things that come into my head, it came straight out.<\/p>", "<p>\"Mattoor? I'll only come if there's mutton.\"<\/p>", "<p>It was a terrible joke. <em>Mattoor. Mutton.<\/em> I'd been building up to it for maybe half a second.<\/p>", "<p>Sam didn't laugh. Sam took the phone away from his ear and held it out over my shoulder.<\/p>", "<p>It was her. She had been on the line the entire time.<\/p>", "<p>I would like to tell you I said something smooth. What I actually did was crash, mentally, at forty kilometres an hour, and blurt out that Sam swears for no reason. I don't know why. I think some part of my brain decided the best defence was to accuse someone else of something, anything, immediately. Sam told me later she hates Malayalam swear words, so either I'd defended her honour or I'd thrown my best friend under a bus. I still don't know which.<\/p>", "<p>I didn't go to the wedding. I had an exam on the twenty-sixth, a data visualisation lab I'd only just got a hall ticket for, because I'd somehow got it issued without paying the fees, which was honestly harder than the exam. I stayed home. I studied a reasonable amount, which is to say I opened the book.<\/p>", "<p>On the evening of the twenty-sixth, with the exam done and dinner not yet ready and no rational part of my brain on duty, I opened Instagram and found her name and typed:<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Mutton indayitilla polum😭<\/div>", "<p><em>So there wasn't even any mutton, I heard.<\/em> Sam had told me. Sam told me everything.<\/p>", "<p>Two minutes later:<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Ni illathond akitka😌<\/div>", "<p><em>We didn't make it because you weren't coming.<\/em> With a smug little face, the one with closed eyes, like a cat that has knocked something off a table and wants you to watch.<\/p>", "<p><em>Ni.<\/em> That's the \"you\" in it, the one you'd use on a junior, or a younger cousin, or someone you're about to tell to shut up. A senior talking down to a junior, perfectly polite about it. I've never liked it. I don't use it on the people I love, and I never have. Just my style. But that morning I let it slide, because I'd have taken any version of <em>you<\/em> she was offering.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>😭<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Next time do make it<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>I'll surely come<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Once in a lifetime opportunity enu ath kayn 😂<\/div>", "<p><em>That was a once-in-a-lifetime opportunity, and it's gone.<\/em><\/p>", "<p>I sat up. I knew a bluff when I saw one, mostly because I invented half of mine on the spot.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Noooooooo<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Liar<\/div>", "<p>Thirty-three minutes went by. I ate dinner. I checked my phone. I pretended to help clear the table. I checked my phone. Then:<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Mutton korma / Mutton hariyali / Mutton kofta / Ithello enu MENU il indaye<\/div>", "<p>A full list. <em>These were all on the menu.<\/em> Typed out like a waiter reading the specials, slashes and everything, and I realised she'd gone and <em>checked<\/em>, or at least wanted me to think she had.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Aa kalla panni anod kalav parne?<\/div>", "<p><em>Did that lying pig tell you I said that?<\/em> By which I meant Sam.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Okay fine I lied. But come on a little harmless lie never killed anyone!<\/div>", "<p>I read that line three times. I'd like to say it was because of some deep instinct, but it was mostly because I was trying to figure out <em>which<\/em> part had been the lie: that there was no mutton, or that there was. I still don't fully know. I think the answer was both, at different times, depending on which version made me suffer more.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>U lil monster<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>I was making a lame joke😭<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Mattoor n mutton<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>That stupid mentioned as if you love mutton😭😂<\/div>", "<p>That stupid was also Sam. It's important to note that within five minutes of our first real conversation, she and I had found the one thing we fully agreed on.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>I told him that if Max was attending the wedding, we would prepare a buffet with only mutton<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>You were not on the list<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Since Sam insisted i was like well let me think about it 😂😭<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Next time please consider<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Yes sure, consider attending Sam's brother's wedding<\/div>", "<p>Sam's brother, who was marrying her sister. In April. It was the most casual invitation anyone has ever given me, tossed off between two mutton jokes, and I said yes to it the way you say yes to <em>see you around<\/em>.<\/p>", "<hr class=\"break\" aria-hidden=\"true\">", "<p>I'd written an exam that morning. I don't remember a single question on it. I remember that between seven and eleven that night I learned the following things about her:<\/p>", "<p>She hated mutton. Not disliked: <em>hated<\/em>, in the way some people hate injustice. She'd only eaten it once in her life, as a kid, when her mother had tricked her by calling it chicken.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Listen chicken is approved by me 😂 / Rest is yucky / Beef is okok<\/div>", "<p>She said this like a minister announcing a policy. Chicken: approved. Beef: under review. Everything else: rejected.<\/p>", "<p>I told her I'd had everything. Camel. Deer. I told her land animals all taste roughly the same and that seafood wins, that shrimp and crab and squid are the best of the best, and that I'd had crab for dinner the night before. I was showing off. I'm not sure why I was showing off about crab.<\/p>", "<p>She said shrimp and mussels were fine and the rest was <em>eww<\/em>.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>How can you hate crab n squid<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Crab because it looks weird and scary<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>HOW<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>I eat squid sometimes, but when I look at it closely, it reminds me of an octopus, and I hate it.<\/div>", "<p>She told me she'd eaten crab in seventh grade and loved it, and then, as she grew up, <em>the racist in me left no choice but to hate crabs because they look weird<\/em>. Which is how, about two hours into knowing her properly, I accused her of being racist against crabs.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>She's a racist<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Am not! atleast i try not to be one<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Did u eat before judging<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>F for effort<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>U liar<\/div>", "<p>She replied by listing my crimes back to me. <em>Blamer, liar, racist. I suppose the list is never ending.<\/em> I'd never been called a blamer before. I liked it more than I should have.<\/p>", "<p>Her replies kept coming in slow, so I told her she should cook her texts faster because my ADHD couldn't handle the wait. She told me she was listening to her cousin rant on one side and texting me on the other, <em>so it's fair enough<\/em>. Then she added a line I'd remember for a long time, mostly because she meant it as a warning and I took it as an instruction manual:<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>You know you should never tell me something that will bother you<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Because i love doing things which people don't want me to do 😭😂<\/div>", "<hr class=\"break\" aria-hidden=\"true\">", "<p>Here's what I hadn't known about Sam.<\/p>", "<p>Sam had a mouth on him, and apparently a fair amount of it had been about me.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Sam be like, 'You know what, my friend Max, we're all on the same vibe,' and blah blah, boosting so much about you<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Hmm, well, as far as I've heard about you from him, he considers you the same way too😭😂 it feels like am shipping you both<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Yea here comes the shipping<\/div>", "<p>I told her the truth, which was that I'd travelled a fair bit and had never met another person quite like Sam. That he'd been my guy for more than half a decade. That, yes, the knife had been me.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Now i know why you gifted Sam A KNIFE<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>He always keeps it with him. Am like don't stab me<\/div>", "<p>She worried about him, it turned out. Sam had been carrying a lot around in his head that semester. Home was hard for him, and he'd been quieter than usual, and she'd noticed in the way you only notice when you actually listen to someone. She'd taken him out with her friends in Bangalore so he'd have some people to sit with. She'd wanted to talk to me about him for months, back in college, and never had a reason to.<\/p>", "<p>So, in a way, the first real thing we ever did together was look out for the same person.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Dw im lookin out for him<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>He is lookin out for me<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Tit for tat<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>And i am witnessing this 😂😭<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Bystander<\/div>", "<p>She sent me a voice note. It was the first time I'd heard her voice pointed at me, and it was mostly her laughing at her own explanation, and I played it twice, and then once more with the volume lower so it would last longer, which is not how volume works.<\/p>", "<p>Then, out of nowhere:<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>The BEST SENIOR AWARD GOES TO PIZZAAAA<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>You were supposed to say that<\/div>", "<p>(She wasn't Pizza yet. That name came later, and I'll get to it. Back then, on my screen, she was just her name and a paperclip emoji.)<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Yesss<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>I was typing<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>And you told it yourself<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Tooo late<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>ARE YOU AN ESPER???<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>I read minds for a living. What is your super power 😭😂<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>I collect random things<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Hoarder<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>I have pet rocks<\/div>", "<p>I did. I still do. She didn't ask to see them. In retrospect, that should have been my first clue that she was the more mature one.<\/p>", "<hr class=\"break\" aria-hidden=\"true\">", "<p>We didn't stop.<\/p>", "<p>That's the part I find hardest to explain to people. It wasn't a spark, or a moment, or a song coming on at the right time. It was more like turning on a tap and forgetting to turn it off. The twenty-sixth turned into the twenty-seventh, and the twenty-seventh turned into four thousand messages by the end of the month, most of them reels.<\/p>", "<p>She'd still call Sam, but now the calls went differently. <em>Give the phone to Max.<\/em> <em>What's he doing?<\/em> <em>Is he studying?<\/em> I became a spy inside my own best friend's phone, and Sam became a very reluctant switchboard.<\/p>", "<p>She sent me reels at midnight. I sent her reels at one. She sent me a reel about someone saying <em>I'm not racist<\/em>, which was a reference to the crab thing, and I sent back a reel that was also, somehow, about the crab thing. She told me she couldn't sleep at night but could sleep forever during the day. She told me that on the night of the wedding, around two in the morning, she'd fainted and thrown up and had a fever, and then followed it up with <em>Rice porridge polu njn 😂😭<\/em>, <em>I've basically turned into rice porridge<\/em>, so I wouldn't worry, which made me worry more.<\/p>", "<p>She told me about a cat she'd loved as a kid. She hated fish, but she'd take a big piece of fried fish from the table and pretend to eat it just so she could sneak it to the cat. She told me she'd once nearly been scammed by a delivery guy who tried to charge her nine hundred and ninety for a bag that cost seven hundred and forty-five, and that she'd fought him from her cousin's wedding, on the phone, in a saree.<\/p>", "<p>I told her I'd never driven before I turned eighteen but felt like I'd been driving since birth because of racing games. She told me she used to play PUBG and drove faster whenever enemies were attacking. We were both, it turned out, the kind of people who think a video game counts as practice.<\/p>", "<p>By the twenty-ninth I had made a new Instagram collection for every reel she sent me that made me laugh. I named it <em>She's a liar<\/em>.<\/p>", "<p>Say it fast and it sounds almost exactly like her name. That was the whole joke. I was very proud of it.<\/p>", "<p>It filled up fast.<\/p>", "<p>That same day, Sam and I were riding back on the highway, him on the back of my bike, when a car drifted into our lane, brushed my bike, and carried on like nothing had happened. Nothing broke. Nobody fell. My heart took about forty minutes to come back down. The first thing I did when we stopped was text her.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Me n Sam almost died today 🫶<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>A car forced a kiss on my bike on the highwayyyy<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>My bike is a real good kisser<\/div>", "<p>Four days into talking to her, and a car had already tried to take me out. I'd ridden for years without so much as a scratch. Sam was on the back. I didn't think anything of that at the time.<\/p>", "<p>She laughed at that. She reacted with the crying-laughing face to both messages, and then sent a voice note telling me to calm down and ride properly, and then another voice note, and then I sent one back, and we spent the rest of that night sending each other voice notes like two people passing a walkie-talkie across a very small room.<\/p>", "<hr class=\"break\" aria-hidden=\"true\">", "<p>The last day of the year was slow and warm. The kind where nothing happens and you remember all of it.<\/p>", "<p>She told me she hated chapathi because of our college mess and loved dosa now. She told me she'd tried almost every flavour of Buldak except kimchi, and that her sister used to judge her for always buying it, and now her sister was the one buying it for her, so they split the cost.<\/p>", "<p>I sent her pictures of the Indomie I'd made, with soy sauce for extra flavour. I explained, at length, that this was how real noodles were supposed to taste.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>See now i have to take cooking classes from the pro himself<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Im ready to be a househusband u kno<\/div>", "<p>I sent that as a joke. I want that on the record. I was nineteen messages into a conversation about noodles and I said it the way you'd say anything else. She didn't make a big deal of it. She reacted with a laughing face and moved on.<\/p>", "<p>That morning she announced she was going to eat grapes under the table at midnight. Twelve grapes, twelve wishes, some tradition off the internet that's supposed to bring you a good partner. I told her, with total confidence, that the grapes thing was plain bullshit. She told me I was delulu. I did not, at the time, consider why a girl might tell a boy about her plan to wish for a partner.<\/p>", "<p>Around noon, she told me about a childhood fantasy of hers. It was absurd, the kind of thing you only say to someone on the last day of December, when the year is almost over and everything feels slightly unofficial.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>My childhood fantasy<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Someone should kidnap me and i will fall in love with him<\/div>", "<p>I didn't know what to say to that, so I didn't say anything, which was the correct move, because a minute later she sent another message, and this one sat on my screen for a long, long time.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>I will give you a chance to say something nice about me<\/div>", "<p>The cursor blinked.<\/p>", "<p>I had a whole collection named after her lying, and I could not think of a single honest sentence.<\/p>"], "mins": 15}, {"n": 2, "number": "Chapter Two", "title": "Husband, Wife & Other Lies", "locked": false, "blocks": ["<p>She sent me grape reels all morning on the last day of the year. Grapes in slow motion. Grapes under tables. A girl in a sequinned dress eating twelve grapes at midnight under a dining table, very solemnly, to find love.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Gonna eat grapes tonight<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>This year I'll test it<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Propaganda by grape farmers<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Let me live in my delulu era<\/div>", "<p>I let her. I'd like to say I understood what she was telling me, but I was a twenty-one-year-old man who had just accused a girl of crab racism, so no.<\/p>", "<p>At midnight I was on my bike, on what I'd announced to the group as <em>the last ride of my life<\/em>, which became, eleven seconds later, <em>the first ride of the year<\/em>. At 1:06 I sent her a voice note and a <em>Happy new year!!<\/em> She sent back <em>Happy new year yoooo<\/em>, and then, in the same breath, demanded to know why I hadn't told her that Sam had crashed a car. He'd been on his way to pick us up. Nobody was hurt. I hadn't told her because I hadn't thought of it as news. She had.<\/p>", "<p>She'd stayed up with her cousin till four or five. I never found out whether she ate the grapes. I never asked. I think I was scared of the answer either way.<\/p>", "<hr class=\"break\" aria-hidden=\"true\">", "<p>The next afternoon we swapped full names, like two people who'd been talking for a week without technically being introduced. She told me her resolution for the year.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>This year I thought of not using cuss words<\/div>", "<p>I believed her. I want that noted.<\/p>", "<p>Forty minutes later, my phone rang, and it wasn't her.<\/p>", "<p>My uncle, my mother's sister's husband, had died. In Qatar, on the first day of the year, younger than my father. The kind of call that makes the house go silent in a way you can hear from every room. The next day his body came home at six in the morning, and there was the prayer, and the burial, and all the small, practical things that grief is made of when you're the eldest son in a big family. I was the one who had to tell my youngest cousin. I don't want to write about that part. I'll just say that afterwards I took the little ones out on rides, one after another, up and down the road, because it was the only thing I could think of that would make them stop looking at the adults.<\/p>", "<p>I texted Pizza in the gaps. Not much. Just that I was there, and that it was heavy.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>I want to spend my days with my people<\/div>", "<p>It wasn't advice. It was a thing she knew about herself, said out loud, so I'd know she understood.<\/p>", "<p>On the third, Sam told her about my uncle. He didn't know she already knew, because I hadn't told him we were talking. She had to pretend it was news.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>I suck at acting<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Our lil secret<\/div>", "<p>She didn't answer that right away. Then:<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>I wish someone was concerned about me like that<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>I'll be concerned<\/div>", "<p>I meant it the way you mean things at three in the morning. Completely.<\/p>", "<hr class=\"break\" aria-hidden=\"true\">", "<p>The week went on, and we kept finding out how the world had been folding us toward each other without asking.<\/p>", "<p>There was the hoodie. Years ago I'd given Sam a hoodie, and Sam, who has never in his life returned a piece of clothing, had used it to smuggle food into her hostel. She'd kept it.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Cycle of clothes<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Fate<\/div>", "<p>There was the shampoo. At 11:38 one night she told me, very seriously, that she'd swallowed shampoo, that it smelled like fruit, that she'd said goodbye, that she was looking at her life. I panicked for a full forty seconds before I realised she was quoting song lyrics.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>If I had a nickel for every time I was pranked with song lyrics, I'd have two<\/div>", "<p>And then, in the very early hours of the fifth of January, there was the thing I'd been building to without knowing it.<\/p>", "<p>It started with letters. An aunt of hers was pushing some boy settled in London on her, and she was furious about it, <em>I'm just twenty-two<\/em>, and somehow that turned into a conversation about love letters.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>No idiot ever gave me a letter<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>I would have fallen instantly<\/div>", "<p>I told her that in eighth grade, I'd thrown a love letter out of a classroom window, rather than let the girl see it. She told me she'd muted my stories before she even knew me, which I chose to take as a compliment, since it meant she'd noticed there was something to mute. Then I told her the thing I'd said to Sam a year before, the thing that had reached her as <em>he says you look fine<\/em>.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>U look like an air hostess<\/div>", "<p>This time it arrived intact.<\/p>", "<p>And then, at 3:57 in the morning, I typed the stupidest, bravest sentence of my life.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>I have memories from past life<\/div>", "<p>She asked what memories. I said I couldn't explain it. I said I just had a feeling.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Wer we married or somn in past life<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>And only u knew<\/div>", "<p>I want to be honest about what this was. It was a confession wearing a costume. I couldn't say <em>I like you<\/em>. I had spent two years unable to look at her for longer than it takes to read a menu. But I could say <em>I think we were married in another life<\/em>, because that sentence had a trapdoor in it. If she laughed, I could laugh too.<\/p>", "<p>She didn't laugh. She played along.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>I was a good wife? A loyal one?<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>The best<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>With the number of times you're getting on my nerves, I would have easily divorced you in my past life<\/div>", "<p>For the next hour, we were married. She told me she wanted her husband to eat and then sleep. She told me to stop calling her <em>bro<\/em>. I told her to call me <em>honey<\/em>. At four in the morning I made noodles, the packet had expired on Christmas Day, half the seasoning had leaked out, and she supervised me over text like a woman watching her husband burn down their first kitchen.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Did you just invent a new noodle species<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Im a married husband living with his mom<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Also a married husband who still has to go to college<\/div>", "<hr class=\"break\" aria-hidden=\"true\">", "<p>That afternoon I took the 3:30 train back to the hostel, and then the bus, and on her recommendation I stopped for loaded fries at a place called Big Fat Roll, and they were exactly as good as she'd promised. Then I got on the next bus and found Sam sitting on it.<\/p>", "<p>I disappeared. I want you to picture a grown man crouching behind a seat on a public bus because his best friend is three rows ahead and his best friend does not know about his wife.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>It's like we're having an affair<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>We are not dating<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>We are a married couple<\/div>", "<p>That evening, at 7:59, she sent me something I've read more times than I'd admit to anyone except you.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Honey, you were right here in front of me, but I didn't recognize you. I searched for you everywhere<\/div>", "<p>From that night on I called her <em>my love<\/em>. The next morning she told someone on Instagram, a stranger flirting in her requests, that she couldn't, because she was already married to me. She sent me the screenshot. I've never been so proud of a screenshot.<\/p>", "<hr class=\"break\" aria-hidden=\"true\">", "<p>Two nights later, I found out that the mirror on my wall was hers.<\/p>", "<p>It had been in the hostel she'd lived in, and when she'd moved out, it had gone wherever things go, and somehow, through a chain of seniors and juniors and rooms and years, it had ended up in mine. I'd been looking into her mirror for months.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>I never used to look into a mirror<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Now I fall in love all over again seeing you<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>I love youuuuu moreeeee<\/div>", "<p>That was the first one with no hedge on it. No <em>haha<\/em>, no costume. At 4:02 that same morning, I called her Pizza for the first time.<\/p>", "<p>I'd love to tell you it was a beautiful moment. It wasn't. We were talking about how we fit together, and I said we were like pizza and an oven, which doesn't even make sense, because I'm not sure which of us was meant to be the oven. She told me that a senior in college used to call her Pizza, back in the day, which made me furious for exactly as long as it took her to promise that she'd make me as many pizzas as I wanted, for the rest of my life.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Woah<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>I am falling for you more than ever<\/div>", "<p>So the name was mine now. I'd stolen it from a senior and a promise.<\/p>", "<hr class=\"break\" aria-hidden=\"true\">", "<p>On the eighth, Sam nearly caught me.<\/p>", "<p>We were in the hostel. I was on a call with her, and Sam was coming down the corridor, and I jumped a barrier and hid a floor up in the stairwell like an animal in a documentary. She told me, very calmly, that if I didn't wait there until he'd gone, she'd kill me. So I waited on the stairs at three in the morning, whispering.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Let him think I'm having a bad time in the toilet<\/div>", "<p>Later the same night, talking to Sam on her side, she accidentally called him by my name. He didn't notice. Instead, he told her, as gossip, that I had a girlfriend. Some girl from a tech event I'd been to. He was very pleased with himself for knowing this.<\/p>", "<p>She told me about it at 4:17, still laughing.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Don't convince me like typical cheater husbands. I was heartbroken<\/div>", "<p>I was, according to my best friend, cheating on my secret wife with a girl from a Google conference. My wife was, according to my best friend, a stranger. My best friend was the only person in the world who knew both of us, and he had absolutely no idea.<\/p>", "<p>That evening she left for Bangalore.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>You're abandoning me<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>I will never<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>You are the love of my life<\/div>", "<p>And then, near midnight, from somewhere on the road:<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>There is something wrong with my hand<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>It's not holding yours<\/div>", "<hr class=\"break\" aria-hidden=\"true\">", "<p>At 2:14 in the morning on the tenth, a new account sent me a message.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Nyla<\/span><span class=\"tag\">Nyla<\/span>Hi love. Shall I follow you? Whats ur name??<\/div>", "<p>It was her. Of course it was her. A second Instagram account, a fake name, and a whole new girl, from Kasaragod apparently, very forward, very interested in me. I told her I was Max from Dufai. She told me we'd meet once I graduated. I asked her if she was my wife.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Nyla<\/span><span class=\"tag\">Nyla<\/span>Calm down max<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>This is some cliché highschool drama<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Write a book about it<\/div>", "<p>And then Nyla tried to seduce me away from Pizza. She really committed to it.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Nyla<\/span><span class=\"tag\">Nyla<\/span>Please I am better than her<\/div>", "<div class=\"bubble her\"><span class=\"who\">Nyla<\/span><span class=\"tag\">Nyla<\/span>Ok don't tell her but you can still love me<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>I have a beautiful and a loving wife<\/div>", "<p>Definitely not Pizza. Definitely a stranger named Nyla, testing the loyalty of a man who'd been married for five days to a woman he'd never held hands with. I passed. She told me later that she'd have been devastated if I hadn't, and also that she'd known I would, and both of those things were true.<\/p>", "<p>Nyla never went away, by the way. She became the name my family would know her by, for longer than I like to admit. But that's later.<\/p>", "<p>That evening, at 8:05, I sent my first message on WhatsApp.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Stalkerrrrrr<\/div>", "<hr class=\"break\" aria-hidden=\"true\">", "<p>Then WhatsApp went quiet. Four days, three hours, sixteen minutes, and some seconds, from the eleventh to the fifteenth. I know the exact number because I went back years later, sure I'd find the hole where I'd lost her. I didn't. WhatsApp went quiet because everything else got loud. Instagram, through Nyla's account, carried something like thirteen thousand messages in those four days.<\/p>", "<p>On the eleventh, her sister had taken her laptop to text a boyfriend, and she had no wifi, and she texted me:<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Am in a pickle<\/div>", "<p>It was the first time I'd heard her say it. I didn't know it would become our word.<\/p>", "<p>The same night, at five in the morning, I sent her a song. <em>Wise men say, only fools rush in.<\/em> She told me I was her junior. That she'd be in trouble. That we had to take it slow. And then, for the first time, she told me about the person before me.<\/p>", "<p>She didn't use his name. She said he'd been her best friend, that his whole family had approved of her, that he still hadn't told his parents they'd broken up. That he'd been there for her, always.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>So even if I die I won't say anything bad about him<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Keep it private until it's permanent<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Told you am in a pickle<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Are you planning on sinking or escaping?<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Consider the jar<\/div>", "<p>On the twelfth, at 2:42 in the morning, she proposed a pact. No calls. No meeting. Nothing, until the year after next. She said it so calmly that I nearly agreed before I realised what it meant.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Nmlk call and meet akanda... rand kollam kayinj meet akaa<\/div>", "<p><em>Let's not call or meet. Let's meet in two years.<\/em><\/p>", "<p>I fought it. She softened. Meeting at the end of next year, then. A wedding in June after that. She typed it like a schedule.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Please anne widow akalle<\/div>", "<p><em>Please don't make me a widow.<\/em> As if I was the one in danger.<\/p>", "<p>That evening I asked if she had Snapchat. She'd deleted it months ago. She downloaded it again, for me. The first thing I did when her name appeared was go into the settings and change it.<\/p>", "<p><em>She's a liar.<\/em><\/p>", "<p>Say it fast and you'll hear why I was so pleased with myself.<\/p>", "<hr class=\"break\" aria-hidden=\"true\">", "<p>On the fourteenth, she told me she'd liked me without knowing anything about me. That I was her forever favourite man. She kept saying <em>like<\/em>. I kept saying <em>love<\/em>. Neither of us remarked on it.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Njan merichalu nee enn bilikoolaa?<\/div>", "<p><em>Even if I die, you won't call me?<\/em><\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>I like you soooo much<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>My forever favourite man<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Ank vere aale kettanda, Maxeeen<\/div>", "<p><em>I don't want to marry anyone else.<\/em> Then, at 10:06 that night:<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Am dead serious okkkk. I want to marry you no matter what<\/div>", "<p>Twenty minutes later, we had our first real fight. It wasn't about another girl, or a password, or anything I'd have predicted. It was about God.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>If you can't be loyal to Allah how can you be loyal to me?<\/div>", "<p>I didn't pray. Not properly, not regularly. She did. She told me her parents would give her maybe three years before they found someone for her. She told me I could leave. She cried, and I listened to her cry through a phone at eleven at night and understood for the first time that loving her was going to cost me something, and that she'd already started paying.<\/p>", "<p>At 11:55 I got up and went to pray. Isha, the night prayer. I asked a friend to walk me through it, because I'd half forgotten how. When I came back she asked what I'd prayed for.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>For a new start. 14/1<\/div>", "<p>She didn't make fun of me for putting a date on it. She understood exactly why I had.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>You can only hurt me by abandoning me<\/div>", "<hr class=\"break\" aria-hidden=\"true\">", "<p>The next afternoon, the fifteenth, she changed her profile picture. Underneath it, a caption: <em>Anything for us.<\/em> She sent me twelve photos of herself, one after another. Faces, but never a camera. Never a video. I'd been begging to see her on a call for days, and she sent twelve photographs instead, as if that was the same thing, as if it was enough.<\/p>", "<p>It was, nearly.<\/p>", "<p>By that evening we'd made a plan. Graduate. Engagement, or nikkah. Then settle down. She typed <em>Ok this plan set<\/em>, like a project manager closing a ticket, and I typed <em>My lovely to-be wifee<\/em>, and it felt like signing something.<\/p>", "<p>And then, that night, she vanished for an hour, and I did what I do.<\/p>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Oi<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Where r u<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>☹️<\/div>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>10 mins<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Okay<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Oii<\/div>", "<div class=\"bubble me\"><span class=\"who\">Me<\/span>Edille?<\/div>", "<p><em>Are you there?<\/em><\/p>", "<p>At 11:51, three days after she'd proposed not calling me for two years, she answered.<\/p>", "<div class=\"bubble her\"><span class=\"who\">Her<\/span>Roomil<\/div>", "<p><em>In my room.<\/em><\/p>", "<p>And then my phone lit up with her name, and for the first time, it wasn't a message.<\/p>"], "mins": 12}, {"n": 3, "number": "Chapter Three", "title": "Where / R / U", "locked": true}, {"n": 4, "number": "Chapter Four", "title": "Pizza Disease", "locked": true}, {"n": 5, "number": "Chapter Five", "title": "The Purple Heart", "locked": true}, {"n": 6, "number": "Chapter Six", "title": "The Bride's Driver", "locked": true}, {"n": 7, "number": "Chapter Seven", "title": "Bullet", "locked": true}, {"n": 8, "number": "Chapter Eight", "title": "Change Your Password", "locked": true}, {"n": 9, "number": "Chapter Nine", "title": "Two Slaps", "locked": true}, {"n": 10, "number": "Chapter Ten", "title": "Make Her Mine Legally", "locked": true}, {"n": 11, "number": "Chapter Eleven", "title": "Just Fries", "locked": true}, {"n": 12, "number": "Chapter Twelve", "title": "Flower Has Been Delivered", "locked": true}, {"n": 13, "number": "Chapter Thirteen", "title": "Nine to Six", "locked": true}, {"n": 14, "number": "Chapter Fourteen", "title": "Umma Meets Her", "locked": true}, {"n": 15, "number": "Chapter Fifteen", "title": "The Counter", "locked": true}, {"n": 16, "number": "Chapter Sixteen", "title": "What's the Verdict?", "locked": true}, {"n": 17, "number": "Chapter Seventeen", "title": "I Came Anyway", "locked": true}, {"n": 18, "number": "Chapter Eighteen", "title": "One Year Since Mutton", "locked": true}, {"n": 19, "number": "Chapter Nineteen", "title": "I Don't Feel Safe", "locked": true}, {"n": 20, "number": "Chapter Twenty", "title": "Poetry", "locked": true}], "front": [{"title": "Synopsis", "body": "<p>Max is a skinny engineering student with a counter for every two-wheeler he's crashed, a family that is far funnier than it means to be, and an unshakeable belief that he remembers her from a past life.<\/p>\n<p>Pizza is older, louder, sharper and much better at everything except replying on time. She says <em>like<\/em> when he says <em>love<\/em>. Once, she lied just to make him say something sweet.<\/p>\n<p>It starts with a plate of mutton. Then a phone screen. Then a diary they write together in a shared note, a ring that doesn't quite fit, a sister who takes two slaps for them, two families who can't know, and more sorries than anyone should be able to count.<\/p>\n<p>This is based on a true story of a love that was funny, loud, tender and, in places, not okay, told by Max. Some parts are fiction. Or are they???<\/p>\n<p>The first line of the note they wrote together reads: <em>She's a liar.<\/em><\/p>\n<p>It was a joke, then.<\/p>"}, {"title": "Before You Start", "body": "<p>This is based on a true story. Names are changed, years are removed, and the chats are based on the real ones, typos and all. A few Malayalam lines are kept the way they were sent, with the meaning right after.<\/p>\n<p>It has swearing, smoking, drinking, family fights, and moments where people say they want to die. It also has, in a few chapters, an honest account of things I did that crossed her boundaries. Those parts are written without much detail and without excuses. They're there because leaving them out would make me the hero of a story where I wasn't.<\/p>\n<p>Take care of yourself while you read. Skip what you need to.<\/p>\n<p><em>Max<\/em><\/p>"}, {"title": "For Pizza and Umma", "body": ""}]};
(function(){
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  const book=document.getElementById('book'), meas=document.getElementById('measure');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let size=parseFloat(store.get('sal-site-size'))||1.05;
  let pages=[], idx=0, busy=false, sections={};

  /* ---------- pagination ---------- */
  function mkPage(cls,run){
    const p=document.createElement('section'); p.className='page '+(cls||'');
    p.innerHTML='<div class="run"><span>She\'s a Liar</span><span>'+esc(run||'')+'</span></div><div class="page-inner"></div><div class="folio"></div><div class="shade"></div>';
    return p;
  }
  // A page fits when the last element's box (not its trailing margin) ends a few px above the page bottom.
  const SLACK=6;
  function fits(inner){
    const last=inner.lastElementChild; if(!last) return true;
    return last.getBoundingClientRect().bottom<=inner.getBoundingClientRect().bottom-SLACK;
  }
  function tagStack(s){const st=[];s.replace(/<(\/?)(em|strong)>/g,(m,c,t)=>{c?st.pop():st.push(t)});return st}
  const closeAll=s=>s+tagStack(s).slice().reverse().map(t=>'</'+t+'>').join('');
  const reopen=s=>tagStack(s).map(t=>'<'+t+'>').join('');

  // Fill as much of `node` (a <p>) as fits; return the remainder <p>, or null if under two words fit.
  function splitP(node,inner){
    const toks=node.innerHTML.split(' ');
    const probe=document.createElement('p'); probe.className=node.className; inner.appendChild(probe);
    let lo=1,hi=toks.length-1,best=0;
    while(lo<=hi){const mid=(lo+hi)>>1;probe.innerHTML=closeAll(toks.slice(0,mid).join(' '));if(fits(inner)){best=mid;lo=mid+1}else hi=mid-1}
    if(best<2){inner.removeChild(probe);return null}
    const head=toks.slice(0,best).join(' ');
    probe.innerHTML=closeAll(head); probe.dataset.k=node.dataset.k;
    const rest=document.createElement('p'); rest.className='cont'; rest.dataset.k=node.dataset.k;
    rest.innerHTML=reopen(head)+toks.slice(best).join(' ');
    return rest;
  }

  // Flow blocks [{html,key}] across as many pages as needed.
  function flow(blocks,o){
    const out=[]; let page,inner,keys;
    const open=()=>{page=mkPage(o.cls,o.run);meas.appendChild(page);inner=page.querySelector('.page-inner');keys=[]};
    const close=()=>{meas.removeChild(page);out.push({el:page,keys,sect:o.sect,label:o.label})};
    open(); if(o.head){inner.insertAdjacentHTML('beforeend',o.head);keys.push(o.sect)}
    for(const b of blocks){
      const tmp=document.createElement('div');tmp.innerHTML=b.html;let node=tmp.firstElementChild;if(!node)continue;
      node.dataset.k=b.key;
      while(node){
        inner.appendChild(node);
        if(fits(inner)){keys.push(node.dataset.k);node=null;break}
        inner.removeChild(node);
        if(node.tagName==='HR'){node=null;break}             // never start a page with a scene break
        if(node.tagName==='P'){const rest=splitP(node,inner);if(rest){keys.push(node.dataset.k);close();open();node=rest;continue}}
        if(!inner.children.length){inner.appendChild(node);keys.push(node.dataset.k);node=null;break} // too tall for any page
        close();open();
      }
    }
    close(); return out;
  }
  const single=(html,o)=>{const p=mkPage(o.cls,o.run);p.querySelector('.page-inner').innerHTML=html;return{el:p,keys:[o.sect],sect:o.sect,label:o.label}};
  const toBlocks=(html,prefix)=>{const t=document.createElement('div');t.innerHTML=html;return[...t.children].map((c,i)=>({html:c.outerHTML,key:prefix+'-'+i}))};

  function layout(){
    document.documentElement.style.setProperty('--size',size+'rem');
    const keep=pages[idx]?pages[idx].keys[0]:store.get('sal-site-k');
    book.innerHTML=''; pages=[]; sections={};
    const chs=DATA.chapters, open=chs.find(c=>!c.locked);

    pages.push(single(
      '<img class="cover-art" src="cover.webp" alt="She&rsquo;s a Liar, by Max. Book cover with purple flowers and two chat bubbles.">'+
      '<div class="go"><button class="btn" data-go="front-0">Open the book</button>'+
      (open?'<button class="btn" data-go="ch'+open.n+'">Chapter One</button>':'')+
      '<button class="btn" id="resume" hidden>Continue</button></div>',
      {cls:'cover',sect:'cover',label:'Cover'}));

    DATA.front.forEach((f,i)=>{
      if(!f.body.trim()) pages.push(single('<h2>'+esc(f.title)+'</h2>',{cls:'dedi center',sect:'front-'+i,label:f.title}));
      else pages.push(...flow(toBlocks(f.body,'f'+i),{head:'<h2 class="mh">'+esc(f.title)+'</h2>',sect:'front-'+i,label:f.title,run:f.title}));
    });

    const rows=chs.map(c=>{
      const n=String(c.n).padStart(2,'0');
      return {html:c.locked
        ?'<div class="toc-row locked"><span class="n">'+n+'</span><span class="ti">'+esc(c.title)+'</span><span class="r" aria-label="locked">🔒</span></div>'
        :'<a class="toc-row" data-go="ch'+c.n+'"><span class="n">'+n+'</span><span class="ti">'+esc(c.title)+'</span><span class="r">'+c.mins+' min</span></a>',key:'toc-'+c.n};
    });
    rows.push({html:'<p class="fin">More chapters unlock soon</p>',key:'toc-end'});
    pages.push(...flow(rows,{head:'<h2 class="mh">Contents</h2>',sect:'toc',label:'Contents',run:'Contents'}));

    chs.forEach(c=>{
      const sect='ch'+c.n;
      if(c.locked){
        pages.push(single('<p class="num">'+esc(c.number)+'</p><h2>'+esc(c.title)+'</h2>'+
          '<div class="lock" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>'+
          '<p class="soon">Locked · coming soon</p>',{cls:'locked-page center',sect,label:c.number+' · locked',run:c.title}));
      } else {
        const bl=c.blocks.map((h,i)=>({html:i===0?h.replace(/^<p>/,'<p class="first">'):h,key:sect+'-'+i}));
        bl.push({html:'<p class="fin">End of '+esc(c.number)+'</p>',key:sect+'-end'});
        pages.push(...flow(bl,{head:'<header class="opener"><p class="num">'+esc(c.number)+'</p><h2>'+esc(c.title)+'</h2><p class="meta">'+c.mins+' min read</p></header>',sect,label:c.number,run:c.title}));
      }
    });
    pages.push(single('<p class="bub" aria-hidden="true" style="font-family:var(--ui)">💜🍕</p><h2 class="mh">To be continued…</h2><p class="soon" style="font-family:var(--ui);color:var(--muted);font-size:.85rem">New chapters unlock here first.</p>',{cls:'center',sect:'end',label:'To be continued'}));

    pages.forEach((p,i)=>{
      if(!(p.sect in sections)) sections[p.sect]=i;
      if(i>0) p.el.querySelector('.folio').textContent=i;
      p.el.hidden=true; book.appendChild(p.el);
    });
    const at=keep?pages.findIndex(p=>p.keys.includes(keep)):-1;
    idx=Math.max(0,at); pages[idx].el.hidden=false; update(); requestAnimationFrame(()=>check(pages[idx].el));

    const r=document.getElementById('resume'), saved=store.get('sal-site-k');
    const si=saved?pages.findIndex(p=>p.keys.includes(saved)):-1;
    if(r&&si>1){r.hidden=false;r.onclick=()=>go(si)}
  }

  /* ---------- turning ---------- */
  function update(){
    const p=pages[idx];
    const inSect=pages.filter(x=>x.sect===p.sect), k=inSect.indexOf(p)+1;
    document.getElementById('where').textContent=p.label+(inSect.length>1?' · '+k+' / '+inSect.length:'');
    document.getElementById('prev').disabled=idx===0;
    document.getElementById('next').disabled=idx===pages.length-1;
    document.getElementById('prog').style.width=(idx/(pages.length-1)*100)+'%';
    if(idx>0) store.set('sal-site-k',p.keys[0]||p.sect);
  }
  function go(to){
    if(busy||to<0||to>=pages.length||to===idx) return;
    const fwd=to>idx, cur=pages[idx].el, nxt=pages[to].el;
    idx=to; update(); requestAnimationFrame(()=>check(nxt));
    if(reduce){cur.hidden=true;nxt.hidden=false;return}
    busy=true; nxt.hidden=false;
    const mover=fwd?cur:nxt, under=fwd?nxt:cur;
    mover.style.zIndex=2; under.style.zIndex=1;
    const frames=fwd?[{transform:'rotateY(0deg)'},{transform:'rotateY(-180deg)'}]:[{transform:'rotateY(-180deg)'},{transform:'rotateY(0deg)'}];
    const opts={duration:620,easing:'cubic-bezier(.33,.08,.27,1)'};
    mover.querySelector('.shade').animate(fwd?[{opacity:0},{opacity:1}]:[{opacity:1},{opacity:0}],{...opts,duration:310,fill:fwd?'none':'none'});
    under.querySelector('.shade').animate(fwd?[{opacity:.6},{opacity:0}]:[{opacity:0},{opacity:.6}],opts);
    mover.animate(frames,opts).onfinish=()=>{cur.hidden=true;mover.style.zIndex='';under.style.zIndex='';busy=false};
  }
  const next=()=>go(idx+1), prev=()=>go(idx-1);
  document.getElementById('next').onclick=next;
  document.getElementById('prev').onclick=prev;
  document.getElementById('contents').onclick=()=>go(sections.toc);
  document.getElementById('smaller').onclick=()=>{size=Math.max(.85,+(size-.05).toFixed(3));store.set('sal-site-size',size);layout()};
  document.getElementById('bigger').onclick=()=>{size=Math.min(1.4,+(size+.05).toFixed(3));store.set('sal-site-size',size);layout()};
  document.addEventListener('keydown',e=>{
    if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next()}
    if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}
  });
  book.addEventListener('click',e=>{
    const g=e.target.closest('[data-go]'); if(g){go(sections[g.dataset.go]);return}
    if(e.target.closest('button,a')) return;
  });
  // Swipe or tap the outer thirds to turn.
  let sx=null,sy=0;
  book.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
  book.addEventListener('pointerup',e=>{
    if(sx===null) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
    if(e.target.closest('button,a,[data-go]')) return;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev();return}
    if(Math.abs(dx)<8&&Math.abs(dy)<8){const r=book.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;if(x>.66)next();else if(x<.34)prev()}
  });
  let rt; const relayout=()=>{clearTimeout(rt);rt=setTimeout(layout,150)};
  addEventListener('resize',relayout);
  // Safety net: if a shown page ever spills (late font, emoji, browser quirk), re-split from the current spot.
  let lastFix=0;
  function check(el){
    if(busy) return; const inner=el.querySelector('.page-inner');
    if(Date.now()-lastFix<3000) return;                  // a block taller than a page can't be fixed; don't loop
    if(inner.lastElementChild&&!fits(inner)&&!el.classList.contains('cover')){lastFix=Date.now();relayout()}
  }
  // Wait for the faces the pages actually use; a fallback font measures shorter and would clip the real one.
  const faces=['400 1em Literata','italic 400 1em Literata','600 1em Literata','400 1em "Young Serif"'];
  const fontsReady=document.fonts
    ?Promise.race([Promise.all(faces.map(f=>document.fonts.load(f,'Aa'))),new Promise(r=>setTimeout(r,4000))])
    :Promise.resolve();
  fontsReady.then(()=>{
    layout(); pages.forEach(p=>p.el.hidden=true); idx=0; pages[0].el.hidden=false; update();
    if(document.fonts) document.fonts.addEventListener('loadingdone',relayout);
  });
})();
